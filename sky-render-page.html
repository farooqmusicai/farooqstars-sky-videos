<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070f">
<title>Farooq Stars · Live Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Sans+Symbols+2&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070f; --panel:#0b0d1a; --card:#0e1120; --line:#1a1e33;
  --ink:#e9ecf7; --mut:#98a0c0; --dim:#5f668a;
  --red:#c8213c; --orange:#ff9a3c; --accent:#8fa8e8;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif;
  --urdu:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;
  --glyph:"Noto Sans Symbols 2","Segoe UI Symbol","Apple Symbols",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink); font:400 14px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
body.ur{font-family:var(--urdu); line-height:2.05}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.gl{font-family:var(--glyph)}
body.ur .mono,body.ur .gl{font-family:var(--sans);line-height:1.5}

/* ================= top bar ================= */
header{
  position:fixed; inset-block-start:0; inset-inline:0; z-index:40;
  display:flex; align-items:flex-start; gap:12px; padding:20px 26px;
  pointer-events:none;
}
header>*{pointer-events:auto}
.brand{font-family:var(--serif);font-weight:600;letter-spacing:.2em;font-size:19px;line-height:1.15}
.brand small{display:block;font-family:var(--sans);font-weight:400;letter-spacing:.04em;
  color:var(--dim);font-size:10.5px;margin-top:3px}
.brand em{display:block;font-style:normal;font-family:var(--sans);font-size:10.5px;
  color:var(--dim);letter-spacing:.02em}
body.ur .brand{font-family:var(--urdu);letter-spacing:0;font-size:20px}
body.ur .brand small,body.ur .brand em{font-family:var(--urdu)}
.spacer{flex:1}
.icons{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

button{font:inherit;font-size:12px;color:var(--ink);background:rgba(20,24,44,.72);
  border:1px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer;
  transition:.16s;white-space:nowrap;backdrop-filter:blur(8px)}
body.ur button{font-size:13px}
button:hover{background:rgba(34,40,74,.88);border-color:#2e3560}
button.on{background:var(--accent);border-color:var(--accent);color:#06070e;font-weight:700}
button.ico{width:32px;height:32px;padding:0;display:grid;place-items:center;font-size:14px}
button.live{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;
  animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.62}}
.seg{display:flex;padding:3px;gap:3px;background:rgba(12,16,34,.8);border:1px solid var(--line);
  border-radius:999px;backdrop-filter:blur(8px)}
.seg button{border:0;background:transparent;padding:5px 14px;backdrop-filter:none;color:var(--dim)}
.seg button:hover{background:rgba(40,48,88,.6);color:var(--ink)}
.seg button.on{background:var(--accent);color:#06070e;font-weight:700}

/* ================= hero canvas ================= */
#hero{position:relative;height:80vh;min-height:470px;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
#stage{display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#pills{position:absolute;inset-block-end:22px;inset-inline:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;gap:9px}
.pillrow{display:flex;gap:7px;align-items:center}
.disco{color:var(--accent);font-size:12px;text-decoration:none;opacity:.9;
  letter-spacing:.04em;border-bottom:1px solid transparent;transition:.15s}
.disco:hover{border-bottom-color:var(--accent)}
body.ur .disco{font-size:13px}
#dateLabel{font-size:11.5px;color:var(--mut);min-width:200px;text-align:center}
body.ur #dateLabel{font-size:12.5px}
.hint{position:absolute;inset-block-end:16px;inset-inline-start:22px;color:#3d4463;
  font-size:10.5px;pointer-events:none}

/* ================= content below ================= */
#content{max-width:880px;margin:0 auto;padding:8px 24px 90px}
.sect{font-family:var(--serif);font-size:23px;font-weight:600;color:#cbd2e8;
  margin:34px 0 14px;letter-spacing:.01em}
body.ur .sect{font-family:var(--urdu);font-size:21px}

.card{background:linear-gradient(160deg,#101326,#0b0d1a);border:1px solid var(--line);
  border-radius:14px;padding:16px 19px;margin-bottom:10px}
.ch{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:3px}
.ch b{font-family:var(--serif);font-size:19px;font-weight:600}
body.ur .ch b{font-family:var(--urdu);font-size:18px}
.cg{font-family:var(--glyph);font-size:17px}
.rx{font-style:normal;font-size:9.5px;font-weight:700;background:#3a1420;color:#ff8a72;
  border:1px solid #5a2030;border-radius:5px;padding:1px 6px;font-family:var(--sans)}
.el{font-style:normal;font-size:9.5px;font-weight:600;border:1px solid;border-radius:5px;
  padding:1px 7px;font-family:var(--sans);opacity:.92}
body.ur .el{font-family:var(--urdu);font-size:11px;padding:0 7px 3px}
.ck{font-size:11.5px;margin-bottom:9px;opacity:.9;letter-spacing:.02em}
body.ur .ck{font-size:13px}
.cd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.chip{background:#151a30;border:1px solid #232949;border-radius:6px;padding:2px 8px;
  font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mut);white-space:nowrap}
.chip.v{border-color:#2b3a5e;background:#101a2e;color:#a8c0ee}
.chip.w{border-color:#3f2f52;background:#170f24;color:#c9a8ee}
.chip i{font-style:normal;font-size:8.5px;letter-spacing:.1em;opacity:.7;margin-inline-end:5px;
  font-family:var(--sans)}
body.ur .chip i{font-family:var(--urdu);font-size:10px}
.cn{font-size:11px;color:var(--dim)}
body.ur .cn{font-size:12.5px}
.cx{font-size:10px;color:#4e5578;font-family:ui-monospace,Menlo,monospace;margin-top:4px}

/* moon card */
#meta .mrow{display:flex;align-items:center;gap:16px}
#meta .big{font-family:var(--serif);font-size:26px;font-weight:600}
body.ur #meta .big{font-family:var(--urdu);font-size:22px}
#meta .sub{font-size:11.5px;color:var(--mut)}
.moondisc{width:46px;height:46px;border-radius:50%;flex:0 0 auto;
  border:1px solid #2a3050;position:relative;overflow:hidden;background:#090b14}

/* aspects */
#aspects ul{list-style:none;display:flex;flex-wrap:wrap;gap:7px}
#aspects li{background:#0f1226;border:1px solid var(--line);border-radius:8px;
  padding:6px 11px;font-size:11.5px}
#aspects .ax{font-weight:600;font-size:11px}
body.ur #aspects .ax{font-size:12.5px}
.mut{color:var(--dim)}

/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
body.ur table{font-size:13px}
th{text-align:start;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  padding:0 7px 9px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
body.ur th{letter-spacing:0;text-transform:none;font-size:11.5px}
td{padding:8px 7px;border-bottom:1px solid rgba(26,30,51,.6);vertical-align:middle;white-space:nowrap}
.pl{font-weight:600}
.pl i{display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-inline-end:7px;vertical-align:middle;box-shadow:0 0 9px currentColor}
td.r{color:#ff8a7a;font-size:11px}
td.d{color:#4d5474;font-size:11px}

/* ================= studio ================= */
body.studio{overflow:hidden;height:100vh;display:grid;
  grid-template-columns:1fr 400px;grid-template-rows:auto 1fr}
body.studio header{position:static;grid-column:1/-1;grid-row:1}
body.studio #hero{height:100%;min-height:0;grid-row:2}
body.studio #content{display:none}
body.studio #pills{display:none}
body.studio .hint{display:none}
body.studio #stage{width:auto;height:100%;aspect-ratio:1080/1920;
  box-shadow:0 0 0 1px #262c52,0 26px 80px rgba(0,0,0,.75);border-radius:8px}
#studioPanel{display:none}
body.studio #studioPanel{display:flex;flex-direction:column;gap:13px;background:var(--panel);
  border-inline-start:1px solid var(--line);padding:20px;overflow-y:auto;grid-row:2}
#studioPanel::-webkit-scrollbar{width:8px}
#studioPanel::-webkit-scrollbar-thumb{background:#1c2140;border-radius:4px}
label{display:block;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);margin-bottom:6px;font-weight:700}
body.ur label{letter-spacing:0;text-transform:none;font-size:12px}
input[type=text],textarea{width:100%;background:#080a18;border:1px solid var(--line);
  border-radius:9px;color:var(--ink);font:inherit;font-size:13px;padding:10px 12px;resize:vertical}
body.ur input[type=text],body.ur textarea{font-size:14px;line-height:2.2}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.65;min-height:170px}
textarea.bad{border-color:var(--red)}
input:focus,textarea:focus{outline:0;border-color:var(--accent)}
.row{display:flex;gap:8px}
.row button{flex:1}
input[type=range]{width:100%;accent-color:var(--accent)}

#toast{position:fixed;inset-block-end:26px;inset-inline-start:50%;
  transform:translateX(-50%) translateY(20px);background:#161c3c;border:1px solid #2c3468;
  border-radius:11px;padding:12px 22px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:.3s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:760px){
  #hero{height:68vh}
  header{padding:14px 16px}
  .brand{font-size:16px}
  #content{padding:8px 16px 70px}
  body.studio{grid-template-columns:1fr}
  body.studio #studioPanel{grid-row:3;border-inline-start:0;border-top:1px solid var(--line);
    max-height:44vh}
}
</style>
</head>
<body>

<header>
  <div class="brand"><span data-t="brand">FAROOQ STARS</span>
    <small data-t="todaysSky">Today's Sky</small>
    <em id="whereWhen"></em>
  </div>
  <div class="spacer"></div>
  <div class="icons">
    <div class="seg">
      <button id="m-browse" class="on" data-t="browse">Browse</button>
      <button id="m-studio" data-t="studio">Studio</button>
    </div>
    <button id="zodiacBtn"><span id="t-zodiac">Vedic</span></button>
    <button id="soundBtn" class="ico" title="Sound">♪</button>
    <button id="langBtn">اردو</button>
  </div>
</header>

<section id="hero">
  <canvas id="stage"></canvas>
  <div class="hint" data-t="drag">Drag to orbit · scroll to zoom</div>
  <div id="pills">
    <div class="pillrow">
      <div class="seg">
        <button id="v-wheel" data-t="wheelView">Astro Wheel</button>
        <button id="v-orrery" class="on" data-t="solarView">Solar System</button>
      </div>
    </div>
    <div class="pillrow">
      <button id="prev">‹</button>
      <div id="dateLabel"></div>
      <button id="next">›</button>
      <button id="now" data-t="today">Today</button>
    </div>
    <a class="disco" href="#content"><span data-t="discover">Discover Your Reading</span> →</a>
  </div>
</section>

<section id="content">
  <div id="meta"></div>
  <h2 class="sect" data-t="weather">Today's sky, body by body</h2>
  <div id="cards"></div>
  <h2 class="sect" data-t="aspectsTitle">Aspects in force</h2>
  <div id="aspects"></div>
  <h2 class="sect" data-t="allPositions">All positions</h2>
  <div class="tw"><div id="table"></div></div>
</section>

<aside id="studioPanel">
  <div><label data-t="badge">Badge</label><input id="f-badge" type="text"></div>
  <div><label data-t="headline">Headline</label><textarea id="f-head" style="min-height:82px"></textarea></div>
  <div><label data-t="keyDates">Key dates</label><input id="f-dates" type="text"></div>
  <div><label data-t="duration">Duration (s)</label>
    <input id="dur" type="range" min="15" max="180" step="5" value="75">
    <div style="text-align:center;font-size:11px;color:var(--mut)"><span id="durVal">75</span>s</div>
  </div>
  <div><label data-t="captions">Caption track (JSON)</label><textarea id="f-caps" dir="ltr"></textarea></div>
  <div class="row">
    <button id="play" data-t="preview">Preview</button>
    <button id="rec" data-t="record">Record</button>
  </div>
</aside>

<div id="toast"></div>
