name: Sky Videos — ماہانہ اردو راشی ویڈیو

on:
  schedule:
    # ہر مہینے کی 28 تاریخ، رات 11:00 UTC (قطر میں 2:00 بجے رات)
    - cron: '0 23 28 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'کون سا مہینہ (2026-09)۔ خالی = اگلا مہینہ'
        required: false
      signs:
        description: 'کون سی راشیاں (0-11، کوما سے جدا)۔ خالی = سب'
        required: false
      dur:
        description: 'ویڈیو کی لمبائی سیکنڈ میں'
        required: false
        default: '120'

concurrency:
  group: sky-videos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: انحصار + Chromium
        run: |
          npm ci --omit=dev || npm i playwright@1.49.0
          npx playwright install --with-deps chromium

      - name: ویڈیوز بنائیں
        env:
          FS_BASE:     ${{ secrets.FS_BASE }}
          FS_SAVE_KEY: ${{ secrets.FS_SKY_SAVE_KEY }}
          FS_MONTH:    ${{ github.event.inputs.month }}
          FS_SIGNS:    ${{ github.event.inputs.signs }}
          FS_DUR:      ${{ github.event.inputs.dur || '120' }}
        run: node render.mjs

      - name: نمونہ محفوظ (اگر کچھ غلط ہو تو دیکھنے کے لیے)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-videos
          path: |
            out/*.mp4
            out/*.json
          retention-days: 5
          if-no-files-found: warn
